# Stage 40B: UART-authoritative Display with maintenance-only Wi-Fi/API/OTA.
# Maintenance networking is disabled on boot, enabled only by Controller/HA
# request through the Controller, and automatically disabled after 15 minutes.
#
# Stage 34 restored the dedicated UART Display role after Stage 33's
# always-on network stack caused visible display jitter and mixed HMI with
# network-gateway responsibilities. Stage 40B keeps that UART-authoritative
# production role and adds only boot-disabled maintenance Wi-Fi/API/OTA.
# No web_server/captive_portal/improv_serial/safe_mode is enabled here.
# `sweet-power-display-ha-gateway.yaml` remains the Stage 33 historical
# record; it is not the production config.
external_components:
  - source:
      type: local
      path: components
    components:
      - display_protocol_uart

esphome:
  name: sweet-power-display
  friendly_name: "Sweet POWER Display"
  min_version: 2026.6.5
  libraries:
    - ESP-TELEMETRY=symlink://C:/Projects/ESP/ESP-TELEMETRY
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(maintenance_wifi_enabled) = false;
          id(maintenance_wifi_connected) = false;
          id(maintenance_ota_active) = false;
          id(maintenance_wifi_deadline_ms) = 0;
          id(gateway_receiver).set_display_maintenance_wifi_actual(false);
          lv_obj_move_foreground(id(wifi_status_indicator));
          lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
          lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0x666666), 0);
          lv_label_set_text(id(wifi_alert_label), "");
          lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
          lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  # Keep ESPHome logs on the native ESP32-S3 USB Serial/JTAG console.
  # GPIO43/GPIO44 are reserved below for the external Waveshare UART
  # connector to the Bridge, so UART0 logging would conflict with the
  # telemetry receiver path. Maintenance Wi-Fi/API/OTA is disabled on boot,
  # so USB remains the normal production logging path.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  reboot_timeout: 0s
  on_connect:
    then:
      - lambda: |-
          id(maintenance_wifi_connected) = true;
          lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
          lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0xFFFFFF), 0);
          lv_label_set_text(id(wifi_alert_label), "");
          lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
          lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);
  on_disconnect:
    then:
      - lambda: |-
          id(maintenance_wifi_connected) = false;
          if (id(maintenance_wifi_enabled)) {
            lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
            lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0xFFFFFF), 0);
            lv_label_set_text(id(wifi_alert_label), "!");
          } else {
            lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
            lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0x666666), 0);
            lv_label_set_text(id(wifi_alert_label), "");
          }
          lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
          lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lambda: |-
            id(maintenance_ota_active) = true;
    on_end:
      then:
        - lambda: |-
            id(maintenance_ota_active) = false;
    on_error:
      then:
        - lambda: |-
            id(maintenance_ota_active) = false;
    on_abort:
      then:
        - lambda: |-
            id(maintenance_ota_active) = false;

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

ch422g:
  - id: io_expander

uart:
  id: gateway_uart
  # Waveshare Rev1.2 routes the external UART connector through the UART
  # selection switch to ESP_RXD/ESP_TXD. This is the ONLY telemetry source
  # -- see stages/Stage34.md. The Display remains the only UART receiver in
  # the architecture (LuxPower -> Gateway(s) -> UDP -> Bridge -> UART ->
  # Display); Stage 34 also added an independent fan-out from the Bridge to
  # a separate Controller board (UDP as of Stage 42G), which does not
  # change the Display's UART-only role.
  rx_pin: GPIO44
  tx_pin: GPIO43
  baud_rate: 230400
  data_bits: 8
  parity: NONE
  stop_bits: 1

# display_protocol_uart owns telemetry decode/state. Every sensor/binary_
# sensor/text_sensor declared below (and the LVGL on_value lambdas further
# down) reads the SAME underlying sensor objects this component publishes
# -- there is no second telemetry pipeline and no display-only duplicate
# state. Stage 34: there is no `api:`/Home Assistant role on this board
# any more (see stages/Stage34.md) -- these entities exist purely so LVGL
# can attach on_value triggers to a single source of truth, the same
# pattern used when this page also fed Home Assistant in Stage 33.

display_protocol_uart:
  id: gateway_receiver
  uart_id: gateway_uart
  rx_gpio: 44
  tx_gpio: 43
  stale_timeout: 60s
  trace_frames: false

# Stage 44H (icon revision): official Home Assistant logo, two pre-colored
# variants supplied by the user as SVG files (pictures/home-assistant-*.svg),
# replacing the earlier LV_SYMBOL_HOME glyph placeholder. ESPHome rasterizes
# SVG sources at compile time (via resvg_py, confirmed present in this
# environment) into RGB565+alpha bitmaps for LVGL -- no external conversion
# step needed. blue = HA connected, gray = not connected; selected at
# runtime by the `ha_connected` binary_sensor below via lv_img_set_src.
image:
  - id: ha_icon_blue
    file: pictures/home-assistant-blue.svg
    resize: 24x24
    type: RGB565
    transparency: alpha_channel
  - id: ha_icon_gray
    file: pictures/home-assistant-gray.svg
    resize: 24x24
    type: RGB565
    transparency: alpha_channel
  # Icon revision: the "SPC" text label (green/red recolor) was replaced
  # with the Sweet POWER Controller house+bolt mark, cropped from the SPC
  # brand logo (pictures/../../sweet-power-controller/icons/SPC.svg) with
  # the wordmark removed -- at 24x24 the full logo's lettering is
  # illegible, same reasoning as the HA icon above. Same rasterize-at-
  # compile-time approach, same 24x24 size as the HA icon. Yellow =
  # Controller link fresh; gray = not connected/stale -- selected at
  # runtime by the `system_link_connected` binary_sensor below via
  # lv_img_set_src.
  - id: spc_icon_yellow
    file: pictures/spc-icon-yellow.svg
    resize: 24x24
    type: RGB565
    transparency: alpha_channel
  - id: spc_icon_gray
    file: pictures/spc-icon-gray.svg
    resize: 24x24
    type: RGB565
    transparency: alpha_channel

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: main_display
    auto_clear_enabled: false
    update_interval: never

globals:
  - id: system_power_blink_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: system_power_blink_visible
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: maintenance_wifi_enabled
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: maintenance_wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: maintenance_ota_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: maintenance_wifi_deadline_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(system_power_blink_active)) {
            return;
          }
          id(system_power_blink_visible) = !id(system_power_blink_visible);
          lv_obj_set_style_text_color(
            id(power_total_label),
            lv_color_hex(id(system_power_blink_visible) ? 0xFF3B30 : 0x202020),
            0
          );
          lv_obj_send_event(id(power_total_label), lvgl::lv_update_event, nullptr);
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(maintenance_wifi_enabled) || id(maintenance_wifi_deadline_ms) == 0) {
                return false;
              }
              if (id(maintenance_ota_active)) {
                return false;
              }
              const uint32_t now = millis();
              return static_cast<int32_t>(now - id(maintenance_wifi_deadline_ms)) >= 0;
          then:
            - lambda: |-
                id(maintenance_wifi_enabled) = false;
                id(maintenance_wifi_connected) = false;
                id(maintenance_wifi_deadline_ms) = 0;
                id(gateway_receiver).set_display_maintenance_wifi_actual(false);
                lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
                lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0x666666), 0);
                lv_label_set_text(id(wifi_alert_label), "");
                lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
                lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);
            - wifi.disable:

lvgl:
  displays:
    - main_display
  buffer_size: 12%
  default_font: montserrat_16
  bg_color: 0x000000
  text_color: 0xFFFFFF
  pad_all: 0
  theme:
    obj:
      bg_color: 0x000000
      bg_opa: cover
      border_width: 0
      outline_width: 0
      shadow_width: 0
      radius: 0
      pad_all: 0
    label:
      bg_opa: transp
      text_color: 0xFFFFFF
  # Stage 37: HMI redesign per the attached mockup -- TOTAL/LPX1/LPX2
  # numeric columns with a shared row-label column on the left. Every value
  # label reads a `display_protocol_uart` sensor object (raw pass-through
  # OR one of the Stage 37/39B derived/system sensors computed/published in
  # DisplayProtocolUARTComponent. Stage 39B: TOTAL Power now comes from
  # Controller `system_output_power`, while Solar/Grid/Battery totals remain
  # inverter-derived.
  # Unavailable/not-fresh values publish NAN, and every lambda below renders
  # that as "--" instead of a misleading number.
  # Layout is row-major: each row below is one full-width flex row with
  # exactly 4 cells (label, TOTAL, LPX1, LPX2), so column alignment across
  # rows falls out naturally from matching cell widths, not from
  # coordinating N separate column stacks.
  widgets:
    - obj:
        id: root_container
        width: 100%
        height: 100%
        bg_color: 0x000000
        border_width: 0
        pad_all: 4
        scrollable: false
        layout:
          type: flex
          flex_flow: column
          flex_align_main: start
          flex_align_cross: stretch
        widgets:
          - obj:
              id: wifi_status_indicator
              width: 180
              height: 56
              align: TOP_RIGHT
              x: -8
              y: 0
              floating: true
              bg_opa: transp
              border_width: 0
              pad_all: 0
              widgets:
                - label:
                    id: wifi_icon_label
                    text: "\uF1EB"
                    text_font: montserrat_22
                    text_color: 0x666666
                    align: TOP_RIGHT
                    x: -10
                    y: 1
                - label:
                    id: wifi_alert_label
                    text: ""
                    text_font: montserrat_14
                    text_color: 0xFFFFFF
                    align: TOP_RIGHT
                    x: -2
                    y: 0
                # Testing aid: Controller<->Display UART link status ("SPC" =
                # Sweet POWER Controller), placed in the SAME floating
                # container as the Wi-Fi icon (a standalone second floating
                # object did not position correctly), anchored TOP_RIGHT with
                # a larger x offset so it sits immediately left of the Wi-Fi
                # glyph with a minimal gap. Icon revision: the "SPC" text
                # label (green/red recolor) was replaced with the Sweet
                # POWER Controller house+bolt image widget, same
                # rasterize-at-compile-time approach as the HA icon below
                # (see the `image:` block above for spc_icon_yellow/gray).
                # Yellow = Controller System (device_id 3) frames currently
                # fresh over this UART link; gray = not connected/stale,
                # including the boot-default before the first frame ever
                # arrives. Driven by the display_protocol_uart
                # `system_link_connected` binary_sensor below -- see its
                # on_state lambda, which swaps `src` between
                # spc_icon_yellow/spc_icon_gray via lv_img_set_src.
                # Container width widened from 64 to 140 (transparent
                # background, so the extra space is invisible) to fit both
                # labels without clipping.
                # Stage 56: icons packed tighter (owner request) -- 4px gaps:
                # Wi-Fi glyph occupies ~x -38..-10, SPC 24px at -42, HA at -70.
                - image:
                    id: spc_icon_img
                    src: spc_icon_gray
                    align: TOP_RIGHT
                    x: -42
                    y: 1
                # Stage 44H: Home Assistant status icon, immediately left of
                # "SPC" (final order HA | SPC | WiFi), same container/anchor
                # approach as SPC above. Originally the LV_SYMBOL_HOME glyph;
                # replaced with the official Home Assistant logo (two
                # pre-colored SVG variants under pictures/, see the `image:`
                # block above) for a recognizable branded icon. Blue =
                # connected, grey = not connected/stale -- see the
                # `ha_connected` binary_sensor below for the actual
                # connected/fresh logic, which swaps `src` between
                # ha_icon_blue/ha_icon_gray via lv_img_set_src; this widget
                # only renders whichever image is currently selected.
                # Container widened 140 -> 180 (transparent background) for
                # this third icon.
                - image:
                    id: ha_icon_img
                    src: ha_icon_gray
                    align: TOP_RIGHT
                    x: -70
                    y: 1
          - label:
              text: "SWEET POWER"
              text_font: montserrat_22
              text_color: 0xFFFFFF
              text_align: center
              width: 100%
              height: 28
          # Stage 56 layout (owner mockup 2026-10-02), revised the same day
          # (Stage 56b): the whole live dataset is in the TOP part of the
          # screen -- inverter table on the left (TOTAL/LXP1/LXP2 x Solar/
          # PV1/PV2/Battery/SOC/Power) and a five-row parameter column on the
          # right (Export / Limit / Grid / Voltage / Current). Everything
          # below the separator is RESERVED for future content (connection
          # schemes, generator, etc.) and intentionally left empty.
          # layout pad_row: 0 everywhere here -- LVGL's default row gap is NOT 0
          # (the theme only zeroes pad_all), and with it the first 186px
          # version clipped the last (SOC) row off the bottom.
          - obj:
              id: top_section
              width: 100%
              height: 226
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: start, pad_row: 0, pad_column: 0}
              widgets:
                # ---- Left: inverter table (63%), 7 rows = 224px ----
                - obj:
                    id: inverter_table
                    width: 63%
                    height: 100%
                    border_width: 0
                    pad_all: 0
                    scrollable: false
                    layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: stretch, pad_row: 0}
                    widgets:
                      # Header: blank label-column cell, then TOTAL/LXP1/LXP2.
                      # LXP1/LXP2 are recolor labels ("LXP1 On", name white,
                      # status colored) updated only on a device-status
                      # transition (see inverter{1,2}_device_status below).
                      - obj:
                          width: 100%
                          height: 30
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - obj: {width: 100, height: 1, border_width: 0, pad_all: 0}
                            - label: {text: "TOTAL", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                            - label: {id: header1_label, text: "LXP1 --", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1, recolor: true}
                            - label: {id: header2_label, text: "LXP2 --", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1, recolor: true}
                      # Solar = PV1+PV2 per inverter, TOTAL = both combined.
                      - obj:
                          width: 100%
                          height: 40
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Solar", text_font: montserrat_20, text_color: 0xFFFFFF, width: 100}
                            - label: {id: solar_total_label, text: "--", text_font: montserrat_26, text_color: 0x00E676, text_align: center, flex_grow: 1}
                            - label: {id: solar_1_label, text: "--", text_font: montserrat_26, text_color: 0x00E676, text_align: center, flex_grow: 1}
                            - label: {id: solar_2_label, text: "--", text_font: montserrat_26, text_color: 0x00E676, text_align: center, flex_grow: 1}
                      # PV1/PV2: smaller subordinate rows under Solar. No TOTAL.
                      - obj:
                          width: 100%
                          height: 22
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "PV1", text_font: montserrat_14, text_color: 0xCCCCCC, width: 100, pad_left: 16}
                            - obj: {flex_grow: 1, height: 1, border_width: 0, pad_all: 0}
                            - label: {id: pv1_1_label, text: "--", text_font: montserrat_16, text_color: 0x00E676, text_align: center, flex_grow: 1}
                            - label: {id: pv1_2_label, text: "--", text_font: montserrat_16, text_color: 0x00E676, text_align: center, flex_grow: 1}
                      - obj:
                          width: 100%
                          height: 22
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "PV2", text_font: montserrat_14, text_color: 0xCCCCCC, width: 100, pad_left: 16}
                            - obj: {flex_grow: 1, height: 1, border_width: 0, pad_all: 0}
                            - label: {id: pv2_1_label, text: "--", text_font: montserrat_16, text_color: 0x00E676, text_align: center, flex_grow: 1}
                            - label: {id: pv2_2_label, text: "--", text_font: montserrat_16, text_color: 0x00E676, text_align: center, flex_grow: 1}
                      # Battery = Charge - Discharge. Signed; green=charging,
                      # red=discharging.
                      - obj:
                          width: 100%
                          height: 40
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Battery", text_font: montserrat_20, text_color: 0xFFFFFF, width: 100}
                            - label: {id: battery_total_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                            - label: {id: battery_1_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                            - label: {id: battery_2_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                      # SOC: per-inverter only, no TOTAL.
                      - obj:
                          width: 100%
                          height: 30
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "SOC", text_font: montserrat_20, text_color: 0xFFFFFF, width: 100}
                            - obj: {flex_grow: 1, height: 1, border_width: 0, pad_all: 0}
                            - label: {id: soc_1_label, text: "--", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                            - label: {id: soc_2_label, text: "--", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                      # Stage 56b Power row (under SOC): TOTAL column = Controller
                      # system_output_power (PZEM #1); LXP1 column = the caption
                      # "Voltage"; LXP2 column = Controller system_output_voltage
                      # (PZEM #1 voltage), always green.
                      - obj:
                          width: 100%
                          height: 40
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Power", text_font: montserrat_20, text_color: 0xFFFFFF, width: 100}
                            - label: {id: power_total_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                            - label: {text: "Voltage", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                            - label: {id: system_voltage_label, text: "--", text_font: montserrat_26, text_color: 0x00E676, text_align: center, flex_grow: 1}
                # ---- Right: parameter column (37%) ----
                # Export / Limit: inverter 1 (both inverters are synchronized in
                # parallel operation). Grid / Voltage / Current: the Eastron grid
                # meter via Controller grid_input_power / grid_raw_voltage /
                # grid_input_current.
                - obj:
                    width: 37%
                    height: 100%
                    border_width: 0
                    pad_left: 12
                    scrollable: false
                    layout: {type: flex, flex_flow: column, flex_align_main: space_between, flex_align_cross: stretch, pad_row: 0}
                    widgets:
                      - obj:
                          width: 100%
                          height: 34
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Export", text_font: montserrat_20, text_color: 0xFFFFFF, width: 124}
                            - label: {id: export_1_label, text: "--", text_font: montserrat_24, text_color: 0xFFFFFF, text_align: left, flex_grow: 1}
                      - obj:
                          width: 100%
                          height: 34
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Limit", text_font: montserrat_20, text_color: 0xFFFFFF, width: 124}
                            - label: {id: export_limit_1_label, text: "--", text_font: montserrat_24, text_color: 0xFFD600, text_align: left, flex_grow: 1}
                      - obj:
                          width: 100%
                          height: 34
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Grid", text_font: montserrat_20, text_color: 0xFFFFFF, width: 124}
                            - label: {id: grid_power_label, text: "--", text_font: montserrat_24, text_color: 0xFFFFFF, text_align: left, flex_grow: 1}
                      - obj:
                          width: 100%
                          height: 34
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Voltage", text_font: montserrat_20, text_color: 0xFFFFFF, width: 124}
                            - label: {id: grid_raw_voltage_label, text: "--", text_font: montserrat_24, text_color: 0xFFFFFF, text_align: left, flex_grow: 1}
                      - obj:
                          width: 100%
                          height: 34
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
