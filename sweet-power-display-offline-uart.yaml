    system_output_power:
      name: "System Output Power"
      id: system_output_power_sensor
      on_value:
        then:
          - lambda: |-
              char text[24];
              lv_color_t color = lv_color_hex(0xFFFFFF);
              bool blink = false;
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
                id(system_power_blink_active) = false;
              } else if (x < 3000.0f) {
                // Stage 56b owner thresholds: < 3 kW white, 3-4.5 kW
                // yellow, > 4.5 kW red (the pre-existing > 5 kW red blink
                // is kept on top of that).
                snprintf(text, sizeof(text), "%.0f W", x);
                color = lv_color_hex(0xFFFFFF);
                id(system_power_blink_active) = false;
              } else if (x <= 4500.0f) {
                snprintf(text, sizeof(text), "%.0f W", x);
                color = lv_color_hex(0xFFD600);
                id(system_power_blink_active) = false;
              } else if (x <= 5000.0f) {
                snprintf(text, sizeof(text), "%.0f W", x);
                color = lv_color_hex(0xFF3B30);
                id(system_power_blink_active) = false;
              } else {
                snprintf(text, sizeof(text), "%.0f W", x);
                color = lv_color_hex(0xFF3B30);
                blink = true;
                id(system_power_blink_active) = true;
                id(system_power_blink_visible) = true;
              }
              const char *current = lv_label_get_text(id(power_total_label));
