binary_sensor:
  - platform: display_protocol_uart
    display_protocol_uart_id: gateway_receiver
    # Stage 44H: effective Home Assistant connection status ("HA" icon,
    # immediately left of "SPC"). Already the AND of Controller-reported
    # state and SPC link freshness (see update_ha_connected_display_() in
    # display_protocol_uart.cpp) -- this handler only has to render it.
    # Blue = connected, grey = not connected (never red, per spec). Icon
    # revision: swaps the ha_icon_img widget's source between the two
    # official-logo bitmaps (ha_icon_blue/ha_icon_gray, see the `image:`
    # block near the top of this file) instead of recoloring a glyph.
    ha_connected:
      id: ha_connected_sensor
      internal: true
      trigger_on_initial_state: true
      on_state:
        then:
          - lambda: |-
              if (x) {
                lv_img_set_src(id(ha_icon_img), id(ha_icon_blue));
              } else {
                lv_img_set_src(id(ha_icon_img), id(ha_icon_gray));
              }
              lv_obj_send_event(id(ha_icon_img), lvgl::lv_update_event, nullptr);
    system_link_connected:
      id: system_link_connected_sensor
      internal: true
      trigger_on_initial_state: true
      on_state:
        then:
          - lambda: |-
              if (x) {
                lv_obj_set_style_text_color(id(spc_icon_label), lv_color_hex(0x00CC44), 0);
              } else {
                lv_obj_set_style_text_color(id(spc_icon_label), lv_color_hex(0xCC0000), 0);
              }
              lv_obj_send_event(id(spc_icon_label), lvgl::lv_update_event, nullptr);
    display_enabled:
      id: display_enabled_sensor
      internal: true
      trigger_on_initial_state: true
      on_state:
        then:
          - lambda: |-
              // Controller-owned display_enabled desired state. The
              // Display boots visible because the mipi_rgb model enables
              // these same CH422G pins during setup; this callback only
              // follows the first valid Controller state and later changes.
              // UART decode, LVGL state, and firmware keep running while
              // the panel/backlight enable lines are low.
              id(io_expander).digital_write(2, x);
              id(io_expander).digital_write(6, x);
    display_maintenance_wifi_requested:
      id: display_maintenance_wifi_requested_sensor
      internal: true
      trigger_on_initial_state: false
      on_state:
        then:
          - if:
              condition:
                lambda: |-
                  return x;
              then:
                - lambda: |-
                    id(maintenance_wifi_enabled) = true;
                    id(maintenance_wifi_connected) = false;
                    id(maintenance_wifi_deadline_ms) = millis() + 900000UL;
                    id(gateway_receiver).set_display_maintenance_wifi_actual(true);
                    lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
                    lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0xFFFFFF), 0);
                    lv_label_set_text(id(wifi_alert_label), "!");
                    lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
                    lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);
                - wifi.enable:
              else:
                - lambda: |-
                    id(maintenance_wifi_enabled) = false;
                    id(maintenance_wifi_connected) = false;
                    id(maintenance_wifi_deadline_ms) = 0;
                    id(gateway_receiver).set_display_maintenance_wifi_actual(false);
                    lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
                    lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0x666666), 0);
                    lv_label_set_text(id(wifi_alert_label), "");
                    lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
                    lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);
                - wifi.disable:
    inverter1_gateway_link_connected:
      id: inverter1_link_connected
      internal: true
      trigger_on_initial_state: true
      on_state:
        then:
          - lambda: |-
              // Export is a binary_sensor pair (no NAN to lean on), so its
              // transport-Off gating is re-evaluated here directly rather
              // than through recompute_derived_.
              char text[8];
              lv_color_t color = lv_color_hex(0xFFFFFF);
              bool trusted = x && id(inverter1_zero_export_enabled).has_state();
              if (!trusted) {
                snprintf(text, sizeof(text), "--");
              } else if (id(inverter1_zero_export_enabled).state) {
                snprintf(text, sizeof(text), "On");
                color = lv_color_hex(0x00E676);
              } else {
                snprintf(text, sizeof(text), "Off");
                color = lv_color_hex(0xFF3B30);
              }
              const char *current = lv_label_get_text(id(export_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(export_1_label), text);
                lv_obj_set_style_text_color(id(export_1_label), color, 0);
                lv_obj_send_event(id(export_1_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_gateway_data_fresh:
      name: "Inverter 1 Fresh"
      id: inverter1_fresh
      # Without this, ESPHome's on_state trigger never fires on the very
