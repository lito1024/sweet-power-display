binary_sensor:
  - platform: display_protocol_uart
    display_protocol_uart_id: gateway_receiver
    inverter1_gateway_data_fresh:
      name: "Inverter 1 Fresh"
      id: inverter1_fresh
      # Without this, ESPHome's on_state trigger never fires on the very
      # first publish_state() call (codegen default is False unless set
      # here) -- see the identical Stage 35 fix for zero_export below.
      trigger_on_initial_state: true
      on_state:
        then:
          - lambda: |-
              // Header: "LXP1 On"/"LXP1 Off", name in the label's default
              // color (white), status word recolored inline via LVGL's
              // "#RRGGBB text#" recolor markup (recolor: true on this
              // label -- see the header widget above).
              char header_text[32];
              snprintf(header_text, sizeof(header_text), x ? "LXP1 #00E676 On#" : "LXP1 #FF3B30 Off#");
              const char *header_current = lv_label_get_text(id(header1_label));
              if (header_current == nullptr || strcmp(header_current, header_text) != 0) {
                lv_label_set_text(id(header1_label), header_text);
                lv_obj_send_event(id(header1_label), lvgl::lv_update_event, nullptr);
              }
              // Export is a binary_sensor pair (no NAN to lean on), so its
              // staleness gating is re-evaluated here directly rather than
              // through recompute_derived_.
              char text[8];
              lv_color_t color = lv_color_hex(0xFFFFFF);
              bool trusted = x && id(inverter1_zero_export_enabled).has_state();
              if (!trusted) {
                snprintf(text, sizeof(text), "--");
              } else if (id(inverter1_zero_export_enabled).state) {
                snprintf(text, sizeof(text), "On");
                color = lv_color_hex(0x00E676);
              } else {
                snprintf(text, sizeof(text), "Off");
                color = lv_color_hex(0xFF3B30);
              }
              const char *current = lv_label_get_text(id(export_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(export_1_label), text);
                lv_obj_set_style_text_color(id(export_1_label), color, 0);
                lv_obj_send_event(id(export_1_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_zero_export_enabled:
      name: "Inverter 1 Zero Export"
      id: inverter1_zero_export_enabled
      trigger_on_initial_state: true
      on_state:
        then:
          - lambda: |-
              // Stage 37 field correction: live verification against the
              // physical inverters showed this Export indicator must track
              // zero_export_enabled directly (On when the register is set,
              // Off when clear) -- not the originally-assumed inverse.
              char text[8];
              lv_color_t color = lv_color_hex(0xFFFFFF);
              bool trusted = id(inverter1_fresh).has_state() && id(inverter1_fresh).state;
              if (!trusted) {
                snprintf(text, sizeof(text), "--");
              } else if (x) {
                snprintf(text, sizeof(text), "On");
                color = lv_color_hex(0x00E676);
              } else {
                snprintf(text, sizeof(text), "Off");
                color = lv_color_hex(0xFF3B30);
              }
              const char *current = lv_label_get_text(id(export_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(export_1_label), text);
                lv_obj_set_style_text_color(id(export_1_label), color, 0);
                lv_obj_send_event(id(export_1_label), lvgl::lv_update_event, nullptr);
              }
