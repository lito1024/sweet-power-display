# Stage 34: dedicated offline UART display -- Stage 33's Wi-Fi/API/OTA/
# web_server/captive_portal/improv_serial/safe_mode additions caused
# visible display jitter and mixed HMI with network-gateway
# responsibilities, so this is the pre-Stage-33 role restored: UART
# receiver + LVGL only, no Wi-Fi, no ESPHome API, no OTA, no HA device
# role. That role now belongs to the Sweet POWER Controller (a separate
# board, sweet-power-controller/) -- see stages/Stage34.md and ADR-012.
# `sweet-power-display-ha-gateway.yaml` is kept, unflashed, as the Stage
# 33 historical record; it is not the production config.
external_components:
  - source:
      type: local
      path: components
    components:
      - display_protocol_uart

esphome:
  name: sweet-power-display
  friendly_name: "Sweet POWER Display"
  min_version: 2026.6.5
  libraries:
    - ESP-TELEMETRY=symlink://C:/Projects/ESP/ESP-TELEMETRY

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  # Keep ESPHome logs on the native ESP32-S3 USB Serial/JTAG console.
  # GPIO43/GPIO44 are reserved below for the external Waveshare UART
  # connector to the Bridge, so UART0 logging would conflict with the
  # telemetry receiver path. Stage 34: this Display has no Wi-Fi/OTA, so
  # USB is the only way to flash and the only way to view logs -- not a
  # recovery-only fallback like the Stage 33 attempt assumed.
  hardware_uart: USB_SERIAL_JTAG

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

ch422g:
  - id: io_expander

uart:
  id: gateway_uart
  # Waveshare Rev1.2 routes the external UART connector through the UART
  # selection switch to ESP_RXD/ESP_TXD. This is the ONLY telemetry source
  # -- see stages/Stage34.md. The Display remains the only UART receiver
  # in the architecture (LuxPower -> Gateway(s) -> ESP-NOW -> Bridge ->
  # UART -> Display); Stage 34 also added an independent ESP-NOW fan-out
  # from the Bridge to a separate Controller board, which does not change
  # the Display's UART-only role.
  rx_pin: GPIO44
  tx_pin: GPIO43
  baud_rate: 230400
  data_bits: 8
  parity: NONE
  stop_bits: 1

# display_protocol_uart owns telemetry decode/state. Every sensor/binary_
# sensor/text_sensor declared below (and the LVGL on_value lambdas further
# down) reads the SAME underlying sensor objects this component publishes
# -- there is no second telemetry pipeline and no display-only duplicate
# state. Stage 34: there is no `api:`/Home Assistant role on this board
# any more (see stages/Stage34.md) -- these entities exist purely so LVGL
# can attach on_value triggers to a single source of truth, the same
# pattern used when this page also fed Home Assistant in Stage 33.

display_protocol_uart:
  id: gateway_receiver
  uart_id: gateway_uart
  rx_gpio: 44
  tx_gpio: 43
  stale_timeout: 60s
  trace_frames: false

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: main_display
    auto_clear_enabled: false
    update_interval: never

globals:
  - id: system_power_blink_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: system_power_blink_visible
    type: bool
    restore_value: no
    initial_value: 'true'

interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(system_power_blink_active)) {
            return;
          }
          id(system_power_blink_visible) = !id(system_power_blink_visible);
          lv_obj_set_style_text_color(
            id(power_total_label),
            lv_color_hex(id(system_power_blink_visible) ? 0xFF3B30 : 0x202020),
            0
          );
          lv_obj_send_event(id(power_total_label), lvgl::lv_update_event, nullptr);

lvgl:
  displays:
    - main_display
  buffer_size: 12%
  default_font: montserrat_16
  bg_color: 0x000000
  text_color: 0xFFFFFF
  pad_all: 0
  theme:
    obj:
      bg_color: 0x000000
      bg_opa: cover
      border_width: 0
      outline_width: 0
      shadow_width: 0
      radius: 0
      pad_all: 0
    label:
      bg_opa: transp
      text_color: 0xFFFFFF
  # Stage 37: HMI redesign per the attached mockup -- TOTAL/LPX1/LPX2
  # numeric columns with a shared row-label column on the left. Every value
  # label reads a `display_protocol_uart` sensor object (raw pass-through
  # OR one of the Stage 37/39B derived/system sensors computed/published in
  # DisplayProtocolUARTComponent. Stage 39B: TOTAL Power now comes from
  # Controller `system_output_power`, while Solar/Grid/Battery totals remain
  # inverter-derived.
  # Unavailable/not-fresh values publish NAN, and every lambda below renders
  # that as "--" instead of a misleading number.
  # Layout is row-major: each row below is one full-width flex row with
  # exactly 4 cells (label, TOTAL, LPX1, LPX2), so column alignment across
  # rows falls out naturally from matching cell widths, not from
  # coordinating N separate column stacks.
  widgets:
    - obj:
        id: root_container
        width: 100%
        height: 100%
        bg_color: 0x000000
        border_width: 0
        pad_all: 4
        scrollable: false
        layout:
          type: flex
          flex_flow: column
          flex_align_main: start
          flex_align_cross: stretch
        widgets:
          - label:
              text: "SWEET POWER"
              text_font: montserrat_22
              text_color: 0xFFFFFF
              text_align: center
              width: 100%
              height: 28
          # Header: blank label-column cell, then TOTAL/LPX1/LPX2. LPX1/LPX2
          # are a single recolor-enabled label combining the inverter name
          # and its connection status ("LPX1 On"/"LPX1 Off") -- name in
          # white, status word in green/red -- updated only on an actual
          # freshness transition (see inverter{1,2}_fresh below), not on
          # every telemetry frame. No icon/image asset used.
          - obj:
              width: 100%
              height: 30
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
              widgets:
                - obj: {width: 150, height: 1, border_width: 0, pad_all: 0}
                - label: {text: "TOTAL", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                - label: {id: header1_label, text: "LXP1 --", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1, recolor: true}
                - label: {id: header2_label, text: "LXP2 --", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1, recolor: true}
          # Solar = PV1+PV2 per inverter, TOTAL = both inverters combined.
          # Same font size as Power/Grid/Battery (visual weight comes from
          # color/position, not from being uniquely oversized).
          - obj:
              width: 100%
              height: 40
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
              widgets:
                - label: {text: "Solar", text_font: montserrat_20, text_color: 0xFFFFFF, width: 150}
                - label: {id: solar_total_label, text: "--", text_font: montserrat_26, text_color: 0x00E676, text_align: center, flex_grow: 1}
                - label: {id: solar_1_label, text: "--", text_font: montserrat_26, text_color: 0x00E676, text_align: center, flex_grow: 1}
                - label: {id: solar_2_label, text: "--", text_font: montserrat_26, text_color: 0x00E676, text_align: center, flex_grow: 1}
          # PV1/PV2: smaller subordinate rows under Solar. No TOTAL value.
          - obj:
              width: 100%
              height: 22
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
              widgets:
                - label: {text: "PV1", text_font: montserrat_14, text_color: 0xCCCCCC, width: 150, pad_left: 16}
                - obj: {flex_grow: 1, height: 1, border_width: 0, pad_all: 0}
                - label: {id: pv1_1_label, text: "--", text_font: montserrat_16, text_color: 0x00E676, text_align: center, flex_grow: 1}
                - label: {id: pv1_2_label, text: "--", text_font: montserrat_16, text_color: 0x00E676, text_align: center, flex_grow: 1}
          - obj:
              width: 100%
              height: 22
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
              widgets:
                - label: {text: "PV2", text_font: montserrat_14, text_color: 0xCCCCCC, width: 150, pad_left: 16}
                - obj: {flex_grow: 1, height: 1, border_width: 0, pad_all: 0}
                - label: {id: pv2_1_label, text: "--", text_font: montserrat_16, text_color: 0x00E676, text_align: center, flex_grow: 1}
                - label: {id: pv2_2_label, text: "--", text_font: montserrat_16, text_color: 0x00E676, text_align: center, flex_grow: 1}
          # Grid = PowerToGrid-PowerFromGrid per inverter, TOTAL = both
          # inverters combined. Positive/export is green; negative/import is
          # red.
          - obj:
              width: 100%
              height: 40
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
              widgets:
                - label: {text: "Grid", text_font: montserrat_20, text_color: 0xFFFFFF, width: 150}
                - label: {id: grid_total_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                - label: {id: grid_1_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                - label: {id: grid_2_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
          # Battery = Battery Charge Power - Battery Discharge Power.
          # Signed; green=charging, red=discharging.
          - obj:
              width: 100%
              height: 40
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
              widgets:
                - label: {text: "Battery", text_font: montserrat_20, text_color: 0xFFFFFF, width: 150}
                - label: {id: battery_total_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                - label: {id: battery_1_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                - label: {id: battery_2_label, text: "--", text_font: montserrat_26, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
          # SOC: per-inverter only, no TOTAL (percentages don't sum).
          - obj:
              width: 100%
              height: 30
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
              widgets:
                - label: {text: "SOC", text_font: montserrat_20, text_color: 0xFFFFFF, width: 150}
                - obj: {flex_grow: 1, height: 1, border_width: 0, pad_all: 0}
                - label: {id: soc_1_label, text: "--", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
                - label: {id: soc_2_label, text: "--", text_font: montserrat_20, text_color: 0xFFFFFF, text_align: center, flex_grow: 1}
          - obj:
              width: 100%
              height: 10
              border_width: 0
              pad_top: 4
              pad_bottom: 4
              scrollable: false
              widgets:
                - obj: {width: 100%, height: 2, bg_color: 0x444444, border_width: 0, pad_all: 0}
          - obj:
              width: 100%
              height: 86
              border_width: 0
              pad_top: 2
              pad_bottom: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: stretch}
              widgets:
                - obj:
                    width: 42%
                    height: 100%
                    border_width: 0
                    pad_right: 8
                    scrollable: false
                    layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: stretch}
                    widgets:
                      - obj:
                          width: 100%
                          height: 40
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Power", text_font: montserrat_20, text_color: 0xFFFFFF, width: 90}
                            - label: {id: power_total_label, text: "--", text_font: montserrat_24, text_color: 0xFFFFFF, text_align: right, flex_grow: 1}
                      - obj:
                          width: 100%
                          height: 40
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Grid V", text_font: montserrat_20, text_color: 0xFFFFFF, width: 90}
                            - label: {id: grid_raw_voltage_label, text: "--", text_font: montserrat_24, text_color: 0xFFFFFF, text_align: right, flex_grow: 1}
                - obj:
                    width: 58%
                    height: 100%
                    border_width: 0
                    pad_left: 94
                    scrollable: false
                    layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: stretch}
                    widgets:
                      - obj:
                          width: 100%
                          height: 40
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Export Limit", text_font: montserrat_20, text_color: 0xFFFFFF, width: 130}
                            - label: {id: export_limit_1_label, text: "--", text_font: montserrat_24, text_color: 0xFFD600, text_align: left, flex_grow: 1}
                      - obj:
                          width: 100%
                          height: 40
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                          widgets:
                            - label: {text: "Export", text_font: montserrat_20, text_color: 0xFFFFFF, width: 130}
                            - label: {id: export_1_label, text: "--", text_font: montserrat_24, text_color: 0xFFFFFF, text_align: left, flex_grow: 1}

# Stage 37: raw pass-through sensors needed either as a directly-displayed
# row (PV1, PV2, SOC) or purely as a computation input for
# recompute_derived_ (Load/EPS/PowerToGrid/PowerFromGrid/BatteryCharge/
# BatteryDischarge -- no LVGL label reads these directly, only the derived
# Grid/Battery sensors below do), plus the Stage 37 derived sensors
# themselves. Controller/system Power and Grid V are shown in the lower
# left parameter column. Export Limit/Export use inverter 1 because both
# inverters are synchronized in parallel operation.

sensor:
  - platform: display_protocol_uart
    display_protocol_uart_id: gateway_receiver
    inverter1_gateway_snapshot_age:
      id: inverter1_packet_age_ms
      internal: true
      on_value:
        then:
          - lambda: |-
              char age[12];
              const uint32_t seconds = static_cast<uint32_t>(x / 1000.0f);
              if (seconds < 60) {
                snprintf(age, sizeof(age), "%us", static_cast<unsigned int>(seconds));
              } else {
                snprintf(age, sizeof(age), "%um%02us",
                         static_cast<unsigned int>(seconds / 60),
                         static_cast<unsigned int>(seconds % 60));
              }

              char header_text[56];
              if (seconds < 15) {
                snprintf(header_text, sizeof(header_text), "LXP1 #00E676 On#");
              } else if (seconds < 60) {
                snprintf(header_text, sizeof(header_text), "LXP1 #FFD600 Wait (%s)#", age);
              } else {
                snprintf(header_text, sizeof(header_text), "LXP1 #FF3B30 Off (%s)#", age);
              }

              const char *header_current = lv_label_get_text(id(header1_label));
              if (header_current == nullptr || strcmp(header_current, header_text) != 0) {
                lv_label_set_text(id(header1_label), header_text);
                lv_obj_send_event(id(header1_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_pv1_power:
      name: "Inverter 1 PV1 Power"
      id: inverter1_pv1_power
      on_value:
        then:
          - lambda: |-
              char text[24];
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else {
                snprintf(text, sizeof(text), "%.0f W", x);
              }
              const char *current = lv_label_get_text(id(pv1_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(pv1_1_label), text);
                lv_obj_send_event(id(pv1_1_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_pv2_power:
      name: "Inverter 1 PV2 Power"
      id: inverter1_pv2_power
      on_value:
        then:
          - lambda: |-
              char text[24];
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else {
                snprintf(text, sizeof(text), "%.0f W", x);
              }
              const char *current = lv_label_get_text(id(pv2_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(pv2_1_label), text);
                lv_obj_send_event(id(pv2_1_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_load_power:
      name: "Inverter 1 Load Power"
      id: inverter1_load_power
    inverter1_eps_power:
      name: "Inverter 1 EPS Power"
      id: inverter1_eps_power
    inverter1_power_to_grid:
      name: "Inverter 1 Power To Grid"
      id: inverter1_power_to_grid
    inverter1_power_from_grid:
      name: "Inverter 1 Power From Grid"
      id: inverter1_power_from_grid
    inverter1_battery_charge_power:
      name: "Inverter 1 Battery Charge Power"
      id: inverter1_battery_charge_power
    inverter1_battery_discharge_power:
      name: "Inverter 1 Battery Discharge Power"
      id: inverter1_battery_discharge_power
    inverter1_battery_soc:
      name: "Inverter 1 Battery SOC"
      id: inverter1_battery_soc
      on_value:
        then:
          - lambda: |-
              char text[24];
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else {
                snprintf(text, sizeof(text), "%.0f%%", x);
              }
              const char *current = lv_label_get_text(id(soc_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(soc_1_label), text);
                lv_obj_send_event(id(soc_1_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_max_backflow_power:
      name: "Inverter 1 Max Backflow Power"
      id: inverter1_max_backflow_power
      on_value:
        then:
          - lambda: |-
              char text[40];
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else {
                snprintf(text, sizeof(text), "%.0f%% (%.0f W)", x, x * 120.0f);
              }
              const char *current = lv_label_get_text(id(export_limit_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(export_limit_1_label), text);
                lv_obj_send_event(id(export_limit_1_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_solar:
      name: "Inverter 1 Solar"
      id: inverter1_solar
      on_value:
        then:
          - lambda: |-
              char text[24];
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else {
                snprintf(text, sizeof(text), "%.0f W", x);
              }
              const char *current = lv_label_get_text(id(solar_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(solar_1_label), text);
                lv_obj_send_event(id(solar_1_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_derived_power:
      name: "Inverter 1 Derived Power"
      id: inverter1_derived_power
    inverter1_grid_net:
      name: "Inverter 1 Grid"
      id: inverter1_grid_net
      on_value:
        then:
          - lambda: |-
              char text[24];
              lv_color_t color = lv_color_hex(0xFFFFFF);
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else if (x > 0) {
                snprintf(text, sizeof(text), "+%.0f W", x);
                color = lv_color_hex(0x00E676);
              } else if (x < 0) {
                snprintf(text, sizeof(text), "%.0f W", x);
                color = lv_color_hex(0xFF3B30);
              } else {
                snprintf(text, sizeof(text), "0 W");
              }
              const char *current = lv_label_get_text(id(grid_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(grid_1_label), text);
                lv_obj_set_style_text_color(id(grid_1_label), color, 0);
                lv_obj_send_event(id(grid_1_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_battery_net:
      name: "Inverter 1 Battery Net"
      id: inverter1_battery_net
      on_value:
        then:
          - lambda: |-
              char text[24];
              lv_color_t color = lv_color_hex(0xFFFFFF);
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else if (x > 0) {
                snprintf(text, sizeof(text), "+%.0f W", x);
                color = lv_color_hex(0x00E676);
              } else if (x < 0) {
                snprintf(text, sizeof(text), "%.0f W", x);
                color = lv_color_hex(0xFF3B30);
              } else {
                snprintf(text, sizeof(text), "0 W");
              }
              const char *current = lv_label_get_text(id(battery_1_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(battery_1_label), text);
                lv_obj_set_style_text_color(id(battery_1_label), color, 0);
                lv_obj_send_event(id(battery_1_label), lvgl::lv_update_event, nullptr);
              }
    inverter2_pv1_power:
      name: "Inverter 2 PV1 Power"
      id: inverter2_pv1_power
      on_value:
        then:
          - lambda: |-
              char text[24];
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else {
                snprintf(text, sizeof(text), "%.0f W", x);
              }
              const char *current = lv_label_get_text(id(pv1_2_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(pv1_2_label), text);
                lv_obj_send_event(id(pv1_2_label), lvgl::lv_update_event, nullptr);
              }
    inverter2_gateway_snapshot_age:
      id: inverter2_packet_age_ms
      internal: true
      on_value:
        then:
          - lambda: |-
              char age[12];
              const uint32_t seconds = static_cast<uint32_t>(x / 1000.0f);
              if (seconds < 60) {
                snprintf(age, sizeof(age), "%us", static_cast<unsigned int>(seconds));
              } else {
                snprintf(age, sizeof(age), "%um%02us",
                         static_cast<unsigned int>(seconds / 60),
                         static_cast<unsigned int>(seconds % 60));
              }

              char header_text[56];
              if (seconds < 15) {
                snprintf(header_text, sizeof(header_text), "LXP2 #00E676 On#");
              } else if (seconds < 60) {
                snprintf(header_text, sizeof(header_text), "LXP2 #FFD600 Wait (%s)#", age);
              } else {
                snprintf(header_text, sizeof(header_text), "LXP2 #FF3B30 Off (%s)#", age);
              }

              const char *header_current = lv_label_get_text(id(header2_label));
              if (header_current == nullptr || strcmp(header_current, header_text) != 0) {
                lv_label_set_text(id(header2_label), header_text);
                lv_obj_send_event(id(header2_label), lvgl::lv_update_event, nullptr);
              }
