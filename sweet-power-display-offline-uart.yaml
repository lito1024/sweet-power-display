              }
              const char *current = lv_label_get_text(id(pv2_2_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(pv2_2_label), text);
                lv_obj_send_event(id(pv2_2_label), lvgl::lv_update_event, nullptr);
              }
    inverter2_load_power:
      name: "Inverter 2 Load Power"
      id: inverter2_load_power
    inverter2_eps_power:
      name: "Inverter 2 EPS Power"
      id: inverter2_eps_power
    inverter2_power_to_grid:
      name: "Inverter 2 Power To Grid"
      id: inverter2_power_to_grid
    inverter2_power_from_grid:
      name: "Inverter 2 Power From Grid"
      id: inverter2_power_from_grid
    inverter2_battery_charge_power:
      name: "Inverter 2 Battery Charge Power"
      id: inverter2_battery_charge_power
    inverter2_battery_discharge_power:
      name: "Inverter 2 Battery Discharge Power"
      id: inverter2_battery_discharge_power
    inverter2_battery_soc:
      name: "Inverter 2 Battery SOC"
      id: inverter2_battery_soc
      on_value:
        then:
          - lambda: |-
              char text[24];
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else {
                snprintf(text, sizeof(text), "%.0f%%", x);
              }
              const char *current = lv_label_get_text(id(soc_2_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(soc_2_label), text);
                lv_obj_send_event(id(soc_2_label), lvgl::lv_update_event, nullptr);
