    # 0 = white. NAN (Controller stale/invalid) -> "--".
    grid_input_power:
      name: "Grid Input Power"
      id: grid_input_power_sensor
    # Stage 56b: Power row, LXP2 column -- PZEM #1 voltage via Controller
