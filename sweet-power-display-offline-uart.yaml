              if (!blink) {
                id(system_power_blink_visible) = true;
              }
              lv_obj_send_event(id(power_total_label), lvgl::lv_update_event, nullptr);
    # Stage 56: Display "Grid" = Controller grid_input_power / FieldId 10009,
    # produced by the Eastron grid meter (Controller Stage 56). Signed as the
    # meter reports it: positive = IMPORT from the external grid (shown
    # without a sign, yellow), negative = EXPORT (shown with "-", green),
    # 0 = white. NAN (Controller stale/invalid) -> "--".
    grid_input_power:
      name: "Grid Input Power"
      id: grid_input_power_sensor
      on_value:
        then:
          - lambda: |-
              char text[24];
              lv_color_t color = lv_color_hex(0xFFFFFF);
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else if (x > 0) {
                snprintf(text, sizeof(text), "%.0f W", x);
                color = lv_color_hex(0xFFD600);
              } else if (x < 0) {
                snprintf(text, sizeof(text), "%.0f W", x);
                color = lv_color_hex(0x00E676);
              } else {
                snprintf(text, sizeof(text), "0 W");
              }
