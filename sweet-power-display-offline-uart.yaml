                const uint32_t seconds = static_cast<uint32_t>(id(inverter2_packet_age_ms).state / 1000.0f);
                if (seconds < 60) {
                  snprintf(age, sizeof(age), "%us", static_cast<unsigned int>(seconds));
                } else {
                  snprintf(age, sizeof(age), "%um%02us",
                           static_cast<unsigned int>(seconds / 60),
                           static_cast<unsigned int>(seconds % 60));
                }
                snprintf(header_text, sizeof(header_text), "LXP2 #FF3B30 Offline (%s)#", age);
              } else {
                snprintf(header_text, sizeof(header_text), "LXP2 #FFD600 Wait#");
              }

              const char *header_current = lv_label_get_text(id(header2_label));
              if (header_current == nullptr || strcmp(header_current, header_text) != 0) {
                // Stage 56: the inverter columns are narrower (~140px);
