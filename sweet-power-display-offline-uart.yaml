# Stage 34: exactly the 8 power entities + Freshness per inverter -- the
# only entities declared here (see stages/Stage34.md). All other catalog
# entities the component CAN publish are simply not declared, so they are
# never instantiated (the component no-ops publishing to a null sensor
# pointer). These sensors are purely internal state for LVGL's on_value
# lambdas below -- there is no ESPHome API on this board to expose them
# to, unlike the superseded Stage 33 attempt.

sensor:
  - platform: display_protocol_uart
    display_protocol_uart_id: gateway_receiver
    inverter1_pv1_power:
      name: "Inverter 1 PV1 Power"
      id: inverter1_pv1_power
      on_value:
        then:
          - lambda: |-
              char text[24];
              snprintf(text, sizeof(text), "%.0f W", x);
              const char *current = lv_label_get_text(id(inv1_pv1_power_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(inv1_pv1_power_label), text);
                lv_obj_send_event(id(inv1_pv1_power_label), lvgl::lv_update_event, nullptr);
              }
    inverter1_pv2_power:
      name: "Inverter 1 PV2 Power"
