              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(grid_power_label), text);
              }
              lv_obj_set_style_text_color(id(grid_power_label), color, 0);
              lv_obj_send_event(id(grid_power_label), lvgl::lv_update_event, nullptr);
    # Stage 56b: Power row, LXP2 column -- PZEM #1 voltage via Controller
