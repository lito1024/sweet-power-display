                lv_obj_send_event(id(inv2_battery_soc_label), lvgl::lv_update_event, nullptr);
              }
    inverter2_eps_power:
      name: "Inverter 2 EPS Power"
      id: inverter2_eps_power
      on_value:
        then:
          - lambda: |-
              char text[24];
              snprintf(text, sizeof(text), "%.0f W", x);
              const char *current = lv_label_get_text(id(inv2_eps_power_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(inv2_eps_power_label), text);
                lv_obj_send_event(id(inv2_eps_power_label), lvgl::lv_update_event, nullptr);
