# Stage 40B: UART-authoritative Display with maintenance-only Wi-Fi/API/OTA.
# Maintenance networking is disabled on boot, enabled only by Controller/HA
# request through the Controller, and automatically disabled after 15 minutes.
#
# Stage 34 restored the dedicated UART Display role after Stage 33's
# always-on network stack caused visible display jitter and mixed HMI with
# network-gateway responsibilities. Stage 40B keeps that UART-authoritative
# production role and adds only boot-disabled maintenance Wi-Fi/API/OTA.
# No web_server/captive_portal/improv_serial/safe_mode is enabled here.
# `sweet-power-display-ha-gateway.yaml` remains the Stage 33 historical
# record; it is not the production config.
external_components:
  - source:
      type: local
      path: components
    components:
      - display_protocol_uart

esphome:
  name: sweet-power-display
  friendly_name: "Sweet POWER Display"
  min_version: 2026.6.5
  libraries:
    - ESP-TELEMETRY=symlink://C:/Projects/ESP/ESP-TELEMETRY
  # Display 3A screen helpers (formatting, owner colour thresholds).
  includes:
    - display_hmi.h
  on_boot:
    priority: -10
    then:
      - lambda: |-
          id(maintenance_wifi_enabled) = false;
          id(maintenance_wifi_connected) = false;
          id(maintenance_ota_active) = false;
          id(maintenance_wifi_deadline_ms) = 0;
          id(gateway_receiver).set_display_maintenance_wifi_actual(false);
          lv_obj_move_foreground(id(wifi_status_indicator));
          lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
          lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0x666666), 0);
          lv_label_set_text(id(wifi_alert_label), "");
          lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
          lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  # Keep ESPHome logs on the native ESP32-S3 USB Serial/JTAG console.
  # GPIO43/GPIO44 are reserved below for the external Waveshare UART
  # connector to the Bridge, so UART0 logging would conflict with the
  # telemetry receiver path. Maintenance Wi-Fi/API/OTA is disabled on boot,
  # so USB remains the normal production logging path.
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  reboot_timeout: 0s
  on_connect:
    then:
      - lambda: |-
          id(maintenance_wifi_connected) = true;
          lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
          lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0xFFFFFF), 0);
          lv_label_set_text(id(wifi_alert_label), "");
          lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
          lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);
  on_disconnect:
    then:
      - lambda: |-
          id(maintenance_wifi_connected) = false;
          if (id(maintenance_wifi_enabled)) {
            lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
            lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0xFFFFFF), 0);
            lv_label_set_text(id(wifi_alert_label), "!");
          } else {
            lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
            lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0x666666), 0);
            lv_label_set_text(id(wifi_alert_label), "");
          }
          lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
          lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lambda: |-
            id(maintenance_ota_active) = true;
    on_end:
      then:
        - lambda: |-
            id(maintenance_ota_active) = false;
    on_error:
      then:
        - lambda: |-
            id(maintenance_ota_active) = false;
    on_abort:
      then:
        - lambda: |-
            id(maintenance_ota_active) = false;

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

ch422g:
  - id: io_expander

uart:
  id: gateway_uart
  # Waveshare Rev1.2 routes the external UART connector through the UART
  # selection switch to ESP_RXD/ESP_TXD. This is the ONLY telemetry source
  # -- see stages/Stage34.md. The Display remains the only UART receiver in
  # the architecture (LuxPower -> Gateway(s) -> UDP -> Bridge -> UART ->
  # Display); Stage 34 also added an independent fan-out from the Bridge to
  # a separate Controller board (UDP as of Stage 42G), which does not
  # change the Display's UART-only role.
  rx_pin: GPIO44
  tx_pin: GPIO43
  baud_rate: 230400
  data_bits: 8
  parity: NONE
  stop_bits: 1

# display_protocol_uart owns telemetry decode/state. Every sensor/binary_
# sensor/text_sensor declared below (and the LVGL on_value lambdas further
# down) reads the SAME underlying sensor objects this component publishes
# -- there is no second telemetry pipeline and no display-only duplicate
# state. Stage 34: there is no `api:`/Home Assistant role on this board
# any more (see stages/Stage34.md) -- these entities exist purely so LVGL
# can attach on_value triggers to a single source of truth, the same
# pattern used when this page also fed Home Assistant in Stage 33.

display_protocol_uart:
  id: gateway_receiver
  uart_id: gateway_uart
  rx_gpio: 44
  tx_gpio: 43
  stale_timeout: 60s
  trace_frames: false

# Stage 44H (icon revision): official Home Assistant logo, two pre-colored
# variants supplied by the user as SVG files (pictures/home-assistant-*.svg),
# replacing the earlier LV_SYMBOL_HOME glyph placeholder. ESPHome rasterizes
# SVG sources at compile time (via resvg_py, confirmed present in this
# environment) into RGB565+alpha bitmaps for LVGL -- no external conversion
# step needed. blue = HA connected, gray = not connected; selected at
# runtime by the `ha_connected` binary_sensor below via lv_img_set_src.
image:
  - id: ha_icon_blue
    file: pictures/home-assistant-blue.svg
    resize: 24x24
    type: RGB565
    transparency: alpha_channel
  - id: ha_icon_gray
    file: pictures/home-assistant-gray.svg
    resize: 24x24
    type: RGB565
    transparency: alpha_channel
  # Icon revision: the "SPC" text label (green/red recolor) was replaced
  # with the Sweet POWER Controller house+bolt mark, cropped from the SPC
  # brand logo (pictures/../../sweet-power-controller/icons/SPC.svg) with
  # the wordmark removed -- at 24x24 the full logo's lettering is
  # illegible, same reasoning as the HA icon above. Same rasterize-at-
  # compile-time approach, same 24x24 size as the HA icon. Yellow =
  # Controller link fresh; gray = not connected/stale -- selected at
  # runtime by the `system_link_connected` binary_sensor below via
  # lv_img_set_src.
  - id: spc_icon_yellow
    file: pictures/spc-icon-yellow.svg
    resize: 24x24
    type: RGB565
    transparency: alpha_channel
  - id: spc_icon_gray
    file: pictures/spc-icon-gray.svg
    resize: 24x24
    type: RGB565
    transparency: alpha_channel

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: main_display
    auto_clear_enabled: false
    update_interval: never

globals:
  - id: system_power_blink_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: system_power_blink_visible
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: maintenance_wifi_enabled
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: maintenance_wifi_connected
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: maintenance_ota_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: maintenance_wifi_deadline_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Display 3A: generator run start (millis, 0 = not running).
  - id: ks_run_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: zegor_run_start_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(system_power_blink_active)) {
            return;
          }
          id(system_power_blink_visible) = !id(system_power_blink_visible);
          lv_obj_set_style_text_color(
            id(load_value_label),
            lv_color_hex(id(system_power_blink_visible) ? 0xFF3B30 : 0x202020),
            0
          );
          lv_obj_send_event(id(load_value_label), lvgl::lv_update_event, nullptr);
  # Display 3A: refresh the KPI tiles and the source strip once per second
  # from the sensor states (the Controller sends its system frames at 1 Hz).
  - interval: 1s
    then:
      - lambda: |-
          auto st = [](esphome::sensor::Sensor *x) -> float { return x->has_state() ? x->state : NAN; };
          display_hmi::refresh_solar(id(solar_value_label), id(solar_sub_label), st(id(solar_total_sensor)),
                                     st(id(inverter1_pv1_power)), st(id(inverter2_pv1_power)),
                                     st(id(inverter1_pv2_power)), st(id(inverter2_pv2_power)));
          display_hmi::refresh_battery(id(battery_value_label), id(battery_sub_label), id(battery_soc_bar),
                                       st(id(inverter1_battery_soc)), st(id(inverter2_battery_soc)),
                                       st(id(battery_total_sensor)));
          const float load = st(id(system_output_power_sensor));
          const bool blink = display_hmi::refresh_load(id(load_value_label), id(load_sub_label), load,
                                                       st(id(system_output_voltage_sensor)));
          id(system_power_blink_active) = blink;
          if (!blink) {
            id(system_power_blink_visible) = true;
            display_hmi::set_color(id(load_value_label), display_hmi::load_color(load));
          }
          // Export On/Off (LXP1 zero-export register) only while LXP1's link is up.
          int export_state = -1;
          if (id(inverter1_link_connected).has_state() && id(inverter1_link_connected).state &&
              id(inverter1_zero_export_enabled).has_state()) {
            export_state = id(inverter1_zero_export_enabled).state ? 1 : 0;
          }
          display_hmi::refresh_grid(id(grid_value_label), id(export_limit_label), id(grid_sub_label),
                                    id(export_use_bar), st(id(grid_input_power_sensor)),
                                    st(id(grid_raw_voltage_sensor)), st(id(grid_input_current_sensor)),
                                    st(id(inverter1_max_backflow_power)), export_state);
          display_hmi::refresh_stabilizer(id(stabilizer_value_label), id(stabilizer_sub_label),
                                          st(id(quant9_output_voltage_sensor)), st(id(elex_output_voltage_sensor)));
          const uint32_t now = millis();
          display_hmi::refresh_generator(id(zegor_tile), id(zegor_status_label), id(zegor_value_label),
                                         id(zegor_oil_label), id(zegor_oil_bar), st(id(zegor_generator_power_sensor)),
                                         st(id(zegor_oil_hours_sensor)), st(id(zegor_oil_interval_sensor)),
                                         id(zegor_run_start_ms), now);
          display_hmi::refresh_generator(id(ks_tile), id(ks_status_label), id(ks_value_label),
                                         id(ks_oil_label), id(ks_oil_bar), st(id(ks_generator_power_sensor)),
                                         st(id(ks_oil_hours_sensor)), st(id(ks_oil_interval_sensor)),
                                         id(ks_run_start_ms), now);
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(maintenance_wifi_enabled) || id(maintenance_wifi_deadline_ms) == 0) {
                return false;
              }
              if (id(maintenance_ota_active)) {
                return false;
              }
              const uint32_t now = millis();
              return static_cast<int32_t>(now - id(maintenance_wifi_deadline_ms)) >= 0;
          then:
            - lambda: |-
                id(maintenance_wifi_enabled) = false;
                id(maintenance_wifi_connected) = false;
                id(maintenance_wifi_deadline_ms) = 0;
                id(gateway_receiver).set_display_maintenance_wifi_actual(false);
                lv_label_set_text(id(wifi_icon_label), LV_SYMBOL_WIFI);
                lv_obj_set_style_text_color(id(wifi_icon_label), lv_color_hex(0x666666), 0);
                lv_label_set_text(id(wifi_alert_label), "");
                lv_obj_send_event(id(wifi_icon_label), lvgl::lv_update_event, nullptr);
                lv_obj_send_event(id(wifi_alert_label), lvgl::lv_update_event, nullptr);
            - wifi.disable:

lvgl:
  displays:
    - main_display
  buffer_size: 12%
  default_font: montserrat_16
  bg_color: 0x000000
  text_color: 0xFFFFFF
  pad_all: 0
  theme:
    obj:
      bg_color: 0x000000
      bg_opa: cover
      border_width: 0
      outline_width: 0
      shadow_width: 0
      radius: 0
      pad_all: 0
    label:
      bg_opa: transp
      text_color: 0xFFFFFF
  # Stage 37: HMI redesign per the attached mockup -- TOTAL/LPX1/LPX2
  # numeric columns with a shared row-label column on the left. Every value
  # label reads a `display_protocol_uart` sensor object (raw pass-through
  # OR one of the Stage 37/39B derived/system sensors computed/published in
  # DisplayProtocolUARTComponent. Stage 39B: TOTAL Power now comes from
  # Controller `system_output_power`, while Solar/Grid/Battery totals remain
  # inverter-derived.
  # Unavailable/not-fresh values publish NAN, and every lambda below renders
  # that as "--" instead of a misleading number.
  # Layout is row-major: each row below is one full-width flex row with
  # exactly 4 cells (label, TOTAL, LPX1, LPX2), so column alignment across
  # rows falls out naturally from matching cell widths, not from
  # coordinating N separate column stacks.
  widgets:
    - obj:
        id: root_container
        width: 100%
        height: 100%
        bg_color: 0x000000
        border_width: 0
        pad_all: 4
        scrollable: false
        layout:
          type: flex
          flex_flow: column
          flex_align_main: start
          flex_align_cross: stretch
        widgets:
          - obj:
              id: wifi_status_indicator
              width: 180
              height: 56
              align: TOP_RIGHT
              x: -8
              y: 0
              floating: true
              bg_opa: transp
              border_width: 0
              pad_all: 0
              widgets:
                - label:
                    id: wifi_icon_label
                    text: "\uF1EB"
                    text_font: montserrat_22
                    text_color: 0x666666
                    align: TOP_RIGHT
                    x: -10
                    y: 1
                - label:
                    id: wifi_alert_label
                    text: ""
                    text_font: montserrat_14
                    text_color: 0xFFFFFF
                    align: TOP_RIGHT
                    x: -2
                    y: 0
                # Testing aid: Controller<->Display UART link status ("SPC" =
                # Sweet POWER Controller), placed in the SAME floating
                # container as the Wi-Fi icon (a standalone second floating
                # object did not position correctly), anchored TOP_RIGHT with
                # a larger x offset so it sits immediately left of the Wi-Fi
                # glyph with a minimal gap. Icon revision: the "SPC" text
                # label (green/red recolor) was replaced with the Sweet
                # POWER Controller house+bolt image widget, same
                # rasterize-at-compile-time approach as the HA icon below
                # (see the `image:` block above for spc_icon_yellow/gray).
                # Yellow = Controller System (device_id 3) frames currently
                # fresh over this UART link; gray = not connected/stale,
                # including the boot-default before the first frame ever
                # arrives. Driven by the display_protocol_uart
                # `system_link_connected` binary_sensor below -- see its
                # on_state lambda, which swaps `src` between
                # spc_icon_yellow/spc_icon_gray via lv_img_set_src.
                # Container width widened from 64 to 140 (transparent
                # background, so the extra space is invisible) to fit both
                # labels without clipping.
                # Stage 56: icons packed tighter (owner request) -- 4px gaps:
                # Wi-Fi glyph occupies ~x -38..-10, SPC 24px at -42, HA at -70.
                - image:
                    id: spc_icon_img
                    src: spc_icon_gray
                    align: TOP_RIGHT
                    x: -42
                    y: 1
                # Stage 44H: Home Assistant status icon, immediately left of
                # "SPC" (final order HA | SPC | WiFi), same container/anchor
                # approach as SPC above. Originally the LV_SYMBOL_HOME glyph;
                # replaced with the official Home Assistant logo (two
                # pre-colored SVG variants under pictures/, see the `image:`
                # block above) for a recognizable branded icon. Blue =
                # connected, grey = not connected/stale -- see the
                # `ha_connected` binary_sensor below for the actual
                # connected/fresh logic, which swaps `src` between
                # ha_icon_blue/ha_icon_gray via lv_img_set_src; this widget
                # only renders whichever image is currently selected.
                # Container widened 140 -> 180 (transparent background) for
                # this third icon.
                - image:
                    id: ha_icon_img
                    src: ha_icon_gray
                    align: TOP_RIGHT
                    x: -70
                    y: 1
          # Display 3A (owner-approved 2026-10-25): title + icons, 4 KPI tiles,
          # per-inverter table, source strip. Tiles are filled by the 1 s
          # display_hmi refresh (interval: above, display_hmi.h); the inverter
          # table cells keep their per-sensor on_value lambdas.
          - label:
              text: "SWEET POWER"
              text_font: montserrat_22
              text_color: 0xFFFFFF
              width: 100%
              height: 34
              pad_left: 6
          - obj:
              id: kpi_row
              width: 100%
              height: 118
              bg_opa: transp
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: stretch, pad_column: 8}
              widgets:
                - obj:
                    id: solar_tile
                    flex_grow: 1
                    height: 100%
                    bg_color: 0x0B0F16
                    border_width: 1
                    border_color: 0x243041
                    radius: 8
                    pad_all: 8
                    scrollable: false
                    layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: stretch, pad_row: 2}
                    widgets:
                      - obj:
                          width: 100%
                          height: 18
                          bg_opa: transp
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          widgets:
                            - label: {text: "SOLAR", text_font: montserrat_14, text_color: 0x8A9BB0, align: LEFT_MID}
                      - label: {id: solar_value_label, text: "--", text_font: montserrat_36, text_color: 0xFFD600, recolor: true}
                      - label: {id: solar_sub_label, text: "--", text_font: montserrat_16, text_color: 0xA9B7C8, recolor: true, long_mode: CLIP}
                - obj:
                    id: battery_tile
                    flex_grow: 1
                    height: 100%
                    bg_color: 0x0B0F16
                    border_width: 1
                    border_color: 0x243041
                    radius: 8
                    pad_all: 8
                    scrollable: false
                    layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: stretch, pad_row: 2}
                    widgets:
                      - obj:
                          width: 100%
                          height: 18
                          bg_opa: transp
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          widgets:
                            - label: {text: "BATTERY", text_font: montserrat_14, text_color: 0x8A9BB0, align: LEFT_MID}
                      - label: {id: battery_value_label, text: "--", text_font: montserrat_36, text_color: 0x4FA3FF, recolor: true}
                      - label: {id: battery_sub_label, text: "--", text_font: montserrat_16, text_color: 0xA9B7C8, recolor: true, long_mode: CLIP}
                      - bar:
                          id: battery_soc_bar
                          width: 100%
                          height: 6
                          min_value: 0
                          max_value: 100
                          value: 0
                          bg_color: 0x1F2A38
                          radius: 3
                          indicator:
                            bg_color: 0x00E676
                            radius: 3
                - obj:
                    id: load_tile
                    flex_grow: 1
                    height: 100%
                    bg_color: 0x0B0F16
                    border_width: 1
                    border_color: 0x243041
                    radius: 8
                    pad_all: 8
                    scrollable: false
                    layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: stretch, pad_row: 2}
                    widgets:
                      - obj:
                          width: 100%
                          height: 18
                          bg_opa: transp
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          widgets:
                            - label: {text: "LOAD", text_font: montserrat_14, text_color: 0x8A9BB0, align: LEFT_MID}
                      - label: {id: load_value_label, text: "--", text_font: montserrat_36, text_color: 0xFFFFFF, recolor: true}
                      - label: {id: load_sub_label, text: "--", text_font: montserrat_16, text_color: 0xA9B7C8, recolor: true, long_mode: CLIP}
                - obj:
                    id: grid_tile
                    flex_grow: 1
                    height: 100%
                    bg_color: 0x0B0F16
                    border_width: 1
                    border_color: 0x243041
                    radius: 8
                    pad_all: 8
                    scrollable: false
                    layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: stretch, pad_row: 2}
                    widgets:
                      - obj:
                          width: 100%
                          height: 18
                          bg_opa: transp
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          widgets:
                            - label: {text: "GRID", text_font: montserrat_14, text_color: 0x8A9BB0, align: LEFT_MID}
                            - label: {id: export_limit_label, text: "LIMIT --", text_font: montserrat_14, text_color: 0xFFD600, align: RIGHT_MID, recolor: true, long_mode: CLIP}
                      - label: {id: grid_value_label, text: "--", text_font: montserrat_36, text_color: 0xFFFFFF, recolor: true}
                      - label: {id: grid_sub_label, text: "--", text_font: montserrat_14, text_color: 0xA9B7C8, recolor: true, long_mode: CLIP}
                      - bar:
                          id: export_use_bar
                          width: 100%
                          height: 6
                          min_value: 0
                          max_value: 100
                          value: 0
                          bg_color: 0x1F2A38
                          radius: 3
                          indicator:
                            bg_color: 0x00E676
                            radius: 3
          - obj:
              id: inverter_table
              width: 100%
              height: 106
              bg_opa: transp
              border_width: 0
              pad_left: 8
              pad_right: 12
              pad_top: 2
              scrollable: false
              layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: stretch, pad_row: 0}
              widgets:
                - obj:
                    width: 100%
                    height: 24
                    bg_opa: transp
                    border_width: 0
                    pad_all: 0
                    scrollable: false
                    layout: {type: flex, flex_flow: row, flex_align_main: start, flex_align_cross: center}
                    widgets:
                      - label: {text: "", width: 210}
                      - label: {text: "Solar", text_font: montserrat_14, text_color: 0x8A9BB0, text_align: right, flex_grow: 1}
