                lv_obj_send_event(id(system_voltage_label), lvgl::lv_update_event, nullptr);
              }
    # Stage 56b: "Current" -- Eastron grid current via Controller
    # grid_input_current / FieldId 10008. Owner thresholds: < 20 A green,
    # 20-25 A yellow, >= 25 A red.
    grid_input_current:
      name: "Grid Input Current"
      id: grid_input_current_sensor
      on_value:
        then:
          - lambda: |-
              char text[24];
              lv_color_t color = lv_color_hex(0xFFFFFF);
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else {
                snprintf(text, sizeof(text), "%.1f A", x);
                if (x < 20.0f) {
                  color = lv_color_hex(0x00E676);
                } else if (x < 25.0f) {
                  color = lv_color_hex(0xFFD600);
                } else {
                  color = lv_color_hex(0xFF3B30);
                }
              }
              const char *current = lv_label_get_text(id(grid_current_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(grid_current_label), text);
              }
