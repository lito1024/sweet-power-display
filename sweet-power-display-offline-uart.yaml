    grid_raw_voltage:
      name: "Grid Raw Voltage"
      id: grid_raw_voltage_sensor
      on_value:
        then:
          - lambda: |-
              char text[24];
              lv_color_t color = lv_color_hex(0xFFFFFF);
              if (std::isnan(x)) {
                snprintf(text, sizeof(text), "--");
              } else {
                snprintf(text, sizeof(text), "%.1f V", x);
                // Stage 56b owner thresholds.
                if (x >= 190.0f && x <= 230.0f) {
                  color = lv_color_hex(0x00E676);
                } else if ((x >= 160.0f && x < 190.0f) || (x > 230.0f && x <= 250.0f)) {
                  color = lv_color_hex(0xFFD600);
                } else {
                  color = lv_color_hex(0xFF3B30);
                }
              }
              const char *current = lv_label_get_text(id(grid_raw_voltage_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(grid_raw_voltage_label), text);
              }
              lv_obj_set_style_text_color(id(grid_raw_voltage_label), color, 0);
              lv_obj_send_event(id(grid_raw_voltage_label), lvgl::lv_update_event, nullptr);
    # Stage 56: inverter-derived Grid TOTAL is no longer displayed (the
