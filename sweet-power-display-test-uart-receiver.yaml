external_components:
  - source:
      type: local
      path: components
    components:
      - display_protocol_uart

esphome:
  name: sweet-power-uart-test
  friendly_name: "Sweet POWER UART Test"
  min_version: 2026.6.5
  libraries:
    - ESP-TELEMETRY=symlink://C:/Projects/ESP/ESP-TELEMETRY

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  # Keep ESPHome logs on the native ESP32-S3 USB Serial/JTAG console.
  # GPIO43/GPIO44 are reserved below for the external Waveshare UART connector,
  # so UART0 logging would conflict with the receiver path.
  hardware_uart: USB_SERIAL_JTAG

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

ch422g:
  - id: io_expander

uart:
  id: gateway_uart
  # Waveshare Rev1.2 routes the external UART connector through the UART
  # selection switch to ESP_RXD/ESP_TXD. Use the board USB Type-C native
  # USB/JTAG port for logs, not the USB-to-UART Type-C port.
  rx_pin: GPIO44
  tx_pin: GPIO43
  baud_rate: 230400
  data_bits: 8
  parity: NONE
  stop_bits: 1

display_protocol_uart:
  id: gateway_receiver
  uart_id: gateway_uart
  rx_gpio: 44
  tx_gpio: 43
  stale_timeout: 5s
  trace_frames: false

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: main_display
    auto_clear_enabled: false
    update_interval: never

lvgl:
  displays:
    - main_display
  buffer_size: 12%
  default_font: montserrat_16
  bg_color: 0x000000
  text_color: 0xFFFFFF
  pad_all: 0
  theme:
    obj:
      bg_color: 0x000000
      bg_opa: cover
      border_width: 0
      outline_width: 0
      shadow_width: 0
      radius: 0
      pad_all: 0
    label:
      bg_opa: transp
      text_color: 0xFFFFFF
  # Stage 32 section 8: minimal two-column validation page proving Inverter
  # 1 and Inverter 2 update simultaneously and independently. Not the final
  # HMI. Left column = inverter1 (device_id 1), right column = inverter2
  # (device_id 2). Each column shows the 8 FAST fields, one NORMAL test
  # field (PV1 Voltage), one SLOW test field (Energy To Grid Total), and a
  # freshness/age indicator (seconds since that device's last frame).
  widgets:
    - obj:
        width: 100%
        height: 100%
        bg_color: 0x000000
        border_width: 0
        pad_all: 8
        scrollable: false
        layout:
          type: flex
          flex_flow: row
          flex_align_main: space_evenly
          flex_align_cross: start
        widgets:
          - obj:
              width: 48%
              height: size_content
              border_width: 0
              pad_all: 0
              scrollable: false
              layout: {type: flex, flex_flow: column, flex_align_main: start, flex_align_cross: stretch}
              widgets:
                - label: {text: "INVERTER 1", text_font: montserrat_20, text_color: 0xFFFFFF, pad_bottom: 8}
                - obj:
                    width: 100%
                    height: size_content
                    border_width: 0
                    pad_all: 0
                    pad_bottom: 6
                    scrollable: false
                    layout: {type: flex, flex_flow: row, flex_align_main: space_between, flex_align_cross: center}
                    widgets:
                      - label: {text: "PV1 Power :", text_font: montserrat_14, text_color: 0xFFFFFF, pad_right: 8}
                      - label: {id: inv1_pv1_power_label, text: "--", text_font: montserrat_16, text_color: 0xFFFFFF}
