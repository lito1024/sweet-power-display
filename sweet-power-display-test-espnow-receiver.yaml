      id: espnow_device_id_mismatches

binary_sensor:
  - platform: display_protocol_espnow
    display_protocol_espnow_id: gateway_receiver
    gateway_data_fresh:
      name: "Gateway Data Fresh"
      id: gateway_data_fresh
      on_state:
        then:
          - lambda: |-
              const char *text = x ? "ESP-NOW FRESH" : "ESP-NOW STALE";
              const uint32_t color = x ? 0x40D98A : 0xF4B740;
              const char *current = lv_label_get_text(id(espnow_status_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(espnow_status_label), text);
                lv_obj_set_style_text_color(id(espnow_status_label), lv_color_hex(color), 0);
                lv_obj_send_event(id(espnow_status_label), lvgl::lv_update_event, nullptr);
              }
    gateway_link_connected:
      name: "Gateway Link Connected"
      id: gateway_link_connected
    luxpower_tcp_connected:
      name: "LuxPower TCP Connected"
      id: luxpower_tcp_connected
      on_state:
        then:
          - lambda: |-
              const char *text = x ? "TCP ON" : "TCP OFF";
              const uint32_t color = x ? 0x40D98A : 0xF45B69;
              const char *current = lv_label_get_text(id(tcp_status_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(tcp_status_label), text);
                lv_obj_set_style_text_color(id(tcp_status_label), lv_color_hex(color), 0);
                lv_obj_send_event(id(tcp_status_label), lvgl::lv_update_event, nullptr);
              }
    input_cache_valid:
      name: "Input Cache Valid"
      id: input_cache_valid
    holding_cache_valid:
      name: "Holding Cache Valid"
      id: holding_cache_valid
    snapshot_values_valid:
      name: "Snapshot Values Valid"
      id: snapshot_values_valid
    feed_in_grid_enabled:
      name: "Feed-In Grid Enabled"
      id: feed_in_grid_enabled
