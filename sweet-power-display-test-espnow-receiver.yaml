    espnow_rssi:
      name: "ESP-NOW RSSI"
      id: espnow_rssi
    espnow_unknown_sender_rejects:
      name: "ESP-NOW Unknown Sender Rejects"
      id: espnow_unknown_sender_rejects
    espnow_device_id_mismatches:
