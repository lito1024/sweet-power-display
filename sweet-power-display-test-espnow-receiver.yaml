external_components:
  - source:
      type: local
      path: components
    components:
      - display_protocol_espnow

esphome:
  name: sweet-power-espnow-test
  friendly_name: "Sweet POWER ESP-NOW Test"
  min_version: 2026.6.5
  libraries:
    - ESP-TELEMETRY=symlink://C:/Projects/ESP/ESP-TELEMETRY

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Sweet Power ESP-NOW Fallback"
    password: !secret fallback_ap_password

api:

ota:
  - platform: esphome

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

ch422g:
  - id: io_expander

display_protocol_espnow:
  id: gateway_receiver
  stale_timeout: 5s
  trace_frames: false
  device_peers:
    - device_id: 1
      mac: !secret gateway_peer_mac

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: main_display
    auto_clear_enabled: false
    update_interval: never

lvgl:
  displays:
    - main_display
  buffer_size: 12%
  default_font: montserrat_20
  bg_color: 0x101216
  text_color: 0xF3F6FA
  pad_all: 18
  widgets:
    - obj:
        width: 100%
        height: 100%
        bg_color: 0x101216
        border_width: 0
        pad_all: 0
        scrollable: false
        layout:
          type: flex
          flex_flow: column
          flex_align_main: space_between
          flex_align_cross: stretch
        widgets:
          - obj:
              height: 62
              width: 100%
              bg_color: 0x101216
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: row
                flex_align_main: space_between
                flex_align_cross: center
              widgets:
                - label:
                    text: "Sweet POWER ESP-NOW Test"
                    text_font: montserrat_32
                    text_color: 0xFFFFFF
                - obj:
                    width: size_content
                    height: size_content
                    border_width: 0
                    pad_all: 0
                    scrollable: false
                    layout:
                      type: flex
                      flex_flow: row
                      flex_align_main: end
                      flex_align_cross: center
                    widgets:
                      - label:
                          id: espnow_status_label
                          text: "ESP-NOW WAITING"
                          text_font: montserrat_18
                          text_color: 0x8B95A7
                      - label:
                          id: tcp_status_label
                          text: "TCP ---"
                          text_font: montserrat_18
                          text_color: 0x8B95A7
                          pad_left: 22
                      - label:
                          id: gateway_sequence_label
                          text: "SEQ ---"
                          text_font: montserrat_18
                          text_color: 0x8B95A7
                          pad_left: 22
          - obj:
              width: 100%
              height: 272
              bg_color: 0x101216
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: row_wrap
                flex_align_main: space_between
                flex_align_cross: center
                flex_align_track: space_evenly
              widgets:
                - obj:
                    width: 31%
                    height: 125
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 12
                    scrollable: false
                    widgets:
                      - label:
                          text: "PV1"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: pv1_power_label
                          text: "--- W"
                          align: bottom_left
                          text_font: montserrat_30
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 125
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 12
                    scrollable: false
                    widgets:
                      - label:
                          text: "PV2"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: pv2_power_label
                          text: "--- W"
                          align: bottom_left
                          text_font: montserrat_30
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 125
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 12
                    scrollable: false
                    widgets:
                      - label:
                          text: "SOC"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: battery_soc_label
                          text: "--- %"
                          align: bottom_left
                          text_font: montserrat_30
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 125
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 12
                    scrollable: false
                    widgets:
                      - label:
                          text: "Charge"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: battery_charge_power_label
                          text: "--- W"
                          align: bottom_left
                          text_font: montserrat_30
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 125
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 12
                    scrollable: false
                    widgets:
                      - label:
                          text: "Discharge"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: battery_discharge_power_label
                          text: "--- W"
                          align: bottom_left
                          text_font: montserrat_30
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 125
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 12
                    scrollable: false
                    widgets:
                      - label:
                          text: "PV1 Energy"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: pv1_energy_total_label
                          text: "--- kWh"
                          align: bottom_left
                          text_font: montserrat_30
                          text_color: 0xFFFFFF
          - obj:
              height: 96
              width: 100%
              bg_color: 0x101216
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: row
                flex_align_main: space_between
                flex_align_cross: center
              widgets:
                - label:
                    id: valid_frames_label
                    text: "frames ---"
                    text_font: montserrat_18
                    text_color: 0xA8B0BE
                - label:
                    id: crc_errors_label
                    text: "crc ---"
                    text_font: montserrat_18
                    text_color: 0xA8B0BE
                - label:
                    id: sequence_gaps_label
                    text: "gaps ---"
                    text_font: montserrat_18
                    text_color: 0xA8B0BE
                - label:
                    id: snapshot_age_label
                    text: "age ---"
                    text_font: montserrat_18
                    text_color: 0xA8B0BE

sensor:
  - platform: display_protocol_espnow
    display_protocol_espnow_id: gateway_receiver
    pv1_power:
      name: "PV1 Power"
      id: pv1_power
      on_value:
        then:
          - lambda: |-
              char text[24];
              snprintf(text, sizeof(text), "%.0f W", x);
              const char *current = lv_label_get_text(id(pv1_power_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(pv1_power_label), text);
                lv_obj_send_event(id(pv1_power_label), lvgl::lv_update_event, nullptr);
              }
    pv2_power:
