external_components:
  - source:
      type: git
      url: https://github.com/lito1024/ESP-LUXPOWER
      ref: v0.2.0
    components:
      - luxpower_tcp

esphome:
  name: sweet-power-c6-full
  friendly_name: "Sweet POWER C6 Full Runtime"
  min_version: 2026.6.5
  includes:
    - diagnostics_heap.h
  libraries:
    - LuxPowerTCP=https://github.com/lito1024/ESP-LUXPOWER.git#v0.2.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - lvgl.label.update:
          id: wifi_status_label
          text: "Wi-Fi ON"
          text_color: 0x40D98A
  on_disconnect:
    then:
      - lvgl.label.update:
          id: wifi_status_label
          text: "Wi-Fi OFF"
          text_color: 0xF45B69

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true
  frequency: 400kHz

ch422g:
  - id: io_expander

globals:
  - id: last_luxpower_metric_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

luxpower_tcp:
  id: luxpower
  host: !secret luxpower_host
  port: !secret luxpower_port
  dongle_serial: !secret luxpower_dongle_serial
  inverter_serial: !secret luxpower_inverter_serial
  input_poll_interval: 1s
  holding_poll_interval: 30s

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: main_display
    auto_clear_enabled: false
    update_interval: never

lvgl:
  displays:
    - main_display
  buffer_size: 12%
  default_font: montserrat_20
  bg_color: 0x101216
  text_color: 0xF3F6FA
  pad_all: 18
  widgets:
    - obj:
        width: 100%
        height: 100%
        bg_color: 0x101216
        border_width: 0
        pad_all: 0
        scrollable: false
        layout:
          type: flex
          flex_flow: column
          flex_align_main: space_between
          flex_align_cross: stretch
        widgets:
          - obj:
              height: 58
              width: 100%
              bg_color: 0x101216
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: row
                flex_align_main: space_between
                flex_align_cross: center
              widgets:
                - label:
                    text: "Sweet POWER"
                    text_font: montserrat_32
                    text_color: 0xFFFFFF
                - obj:
                    width: size_content
                    height: size_content
                    border_width: 0
                    pad_all: 0
                    scrollable: false
                    layout:
                      type: flex
                      flex_flow: row
                      flex_align_main: end
                      flex_align_cross: center
                    widgets:
                      - label:
                          id: wifi_status_label
                          text: "Wi-Fi ---"
                          text_font: montserrat_18
                          text_color: 0x8B95A7
                      - label:
                          id: tcp_status_label
                          text: "TCP ---"
                          text_font: montserrat_18
                          text_color: 0x8B95A7
                          pad_left: 24
          - obj:
              width: 100%
              height: 330
              bg_color: 0x101216
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: row_wrap
                flex_align_main: space_between
                flex_align_cross: center
                flex_align_track: space_evenly
              widgets:
                - obj:
                    width: 31%
                    height: 145
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 14
                    scrollable: false
                    widgets:
                      - label:
                          text: "PV1 Power"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: pv1_power_label
                          text: "--- W"
                          align: bottom_left
                          text_font: montserrat_32
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 145
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 14
                    scrollable: false
                    widgets:
                      - label:
                          text: "PV2 Power"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: pv2_power_label
                          text: "--- W"
                          align: bottom_left
                          text_font: montserrat_32
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 145
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 14
                    scrollable: false
                    widgets:
                      - label:
                          text: "Battery SOC"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: battery_soc_label
                          text: "--- %"
                          align: bottom_left
                          text_font: montserrat_32
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 145
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 14
                    scrollable: false
                    widgets:
                      - label:
                          text: "Charge Power"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: battery_charge_power_label
                          text: "--- W"
                          align: bottom_left
                          text_font: montserrat_32
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 145
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 14
                    scrollable: false
                    widgets:
                      - label:
                          text: "Discharge Power"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: battery_discharge_power_label
                          text: "--- W"
                          align: bottom_left
                          text_font: montserrat_32
                          text_color: 0xFFFFFF
                - obj:
                    width: 31%
                    height: 145
                    bg_color: 0x1A1E26
                    border_width: 1
                    border_color: 0x2A303B
                    radius: 8
                    pad_all: 14
                    scrollable: false
                    widgets:
                      - label:
                          text: "PV1 Energy Total"
                          text_font: montserrat_18
                          text_color: 0xA8B0BE
                      - label:
                          id: pv1_energy_total_label
                          text: "--- kWh"
                          align: bottom_left
                          text_font: montserrat_32
                          text_color: 0xFFFFFF
          - obj:
              height: 48
              width: 100%
              bg_color: 0x101216
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: row
                flex_align_main: space_between
                flex_align_cross: center
              widgets:
                - label:
                    text: "Feed-In Grid"
                    text_font: montserrat_20
                    text_color: 0xA8B0BE
                - label:
                    id: feed_in_grid_label
                    text: "---"
                    text_font: montserrat_24
                    text_color: 0x8B95A7

sensor:
  - platform: luxpower_tcp
    luxpower_id: luxpower
    pv1_power:
      name: "PV1 Power"
      id: pv1_power
      on_value:
        then:
          - lambda: |-
              id(last_luxpower_metric_ms) = millis();
              char text[24];
              snprintf(text, sizeof(text), "%.0f W", x);
              const char *current = lv_label_get_text(id(pv1_power_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(pv1_power_label), text);
                lv_obj_send_event(id(pv1_power_label), lvgl::lv_update_event, nullptr);
              }
    pv2_power:
      name: "PV2 Power"
      id: pv2_power
      on_value:
        then:
          - lambda: |-
              id(last_luxpower_metric_ms) = millis();
              char text[24];
              snprintf(text, sizeof(text), "%.0f W", x);
              const char *current = lv_label_get_text(id(pv2_power_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(pv2_power_label), text);
                lv_obj_send_event(id(pv2_power_label), lvgl::lv_update_event, nullptr);
              }
    battery_soc:
      name: "Battery SOC"
      id: battery_soc
      on_value:
        then:
          - lambda: |-
              id(last_luxpower_metric_ms) = millis();
              char text[24];
              snprintf(text, sizeof(text), "%.0f %%", x);
              const char *current = lv_label_get_text(id(battery_soc_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(battery_soc_label), text);
                lv_obj_send_event(id(battery_soc_label), lvgl::lv_update_event, nullptr);
              }
    battery_charge_power:
      name: "Battery Charge Power"
      id: battery_charge_power
      on_value:
        then:
          - lambda: |-
              id(last_luxpower_metric_ms) = millis();
              char text[24];
              snprintf(text, sizeof(text), "%.0f W", x);
              const char *current = lv_label_get_text(id(battery_charge_power_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(battery_charge_power_label), text);
                lv_obj_send_event(id(battery_charge_power_label), lvgl::lv_update_event, nullptr);
              }
    battery_discharge_power:
      name: "Battery Discharge Power"
      id: battery_discharge_power
      on_value:
        then:
          - lambda: |-
              id(last_luxpower_metric_ms) = millis();
              char text[24];
              snprintf(text, sizeof(text), "%.0f W", x);
              const char *current = lv_label_get_text(id(battery_discharge_power_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(battery_discharge_power_label), text);
                lv_obj_send_event(id(battery_discharge_power_label), lvgl::lv_update_event, nullptr);
              }
    pv1_energy_total:
      name: "PV1 Energy Total"
      id: pv1_energy_total
      on_value:
        then:
          - lambda: |-
              id(last_luxpower_metric_ms) = millis();
              char text[24];
              snprintf(text, sizeof(text), "%.1f kWh", x);
              const char *current = lv_label_get_text(id(pv1_energy_total_label));
              if (current == nullptr || strcmp(current, text) != 0) {
                lv_label_set_text(id(pv1_energy_total_label), text);
                lv_obj_send_event(id(pv1_energy_total_label), lvgl::lv_update_event, nullptr);
              }

binary_sensor:
  - platform: luxpower_tcp
    luxpower_id: luxpower
    feed_in_grid_enabled:
      name: "Feed-In Grid Enabled"
      id: feed_in_grid_enabled
      on_state:
        then:
          - if:
              condition:
                binary_sensor.is_on: feed_in_grid_enabled
              then:
                - lvgl.label.update:
                    id: feed_in_grid_label
                    text: "ON"
                    text_color: 0x40D98A
              else:
                - lvgl.label.update:
                    id: feed_in_grid_label
                    text: "OFF"
                    text_color: 0xF45B69
    tcp_connected:
      name: "LuxPower TCP Connected"
      id: luxpower_tcp_connected
      on_state:
        then:
          - if:
              condition:
                binary_sensor.is_on: luxpower_tcp_connected
              then:
                - lvgl.label.update:
                    id: tcp_status_label
                    text: "TCP ON"
                    text_color: 0x40D98A
              else:
                - lvgl.label.update:
                    id: tcp_status_label
                    text: "TCP OFF"
                    text_color: 0xF45B69

interval:
  - interval: 10s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t last_metric_ms = id(last_luxpower_metric_ms);
          const uint32_t input_cache_age_proxy_ms = last_metric_ms == 0 ? 0 : now - last_metric_ms;
          const bool tcp_connected =
              id(luxpower_tcp_connected).has_state() && id(luxpower_tcp_connected).state;
          ESP_LOGI("display_diag",
                   "free_heap=%u free_internal_heap=%u free_psram=%u input_cache_age_proxy_ms=%u tcp_connected=%s",
                   static_cast<unsigned int>(esp_get_free_heap_size()),
                   static_cast<unsigned int>(heap_caps_get_free_size(MALLOC_CAP_INTERNAL)),
                   static_cast<unsigned int>(heap_caps_get_free_size(MALLOC_CAP_SPIRAM)),
                   static_cast<unsigned int>(input_cache_age_proxy_ms),
                   tcp_connected ? "true" : "false");
