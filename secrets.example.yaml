# Copy this file to secrets.yaml and fill in local values.
# secrets.yaml is ignored by Git and must not be committed.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"
fallback_ap_password: "CHANGE_ME_FALLBACK_AP_PASSWORD"

# Stage 33: ESPHome network services (Home Assistant API + OTA) for the
# UART receiver / HA gateway YAML. Generate a real 32-byte base64 key for
# api_encryption_key, e.g.:
#   python -c "import base64,secrets;print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_encryption_key: "CHANGE_ME_BASE64_32_BYTE_KEY"
ota_password: "CHANGE_ME_OTA_PASSWORD"

luxpower_host: "192.0.2.10"
luxpower_port: 8000
luxpower_dongle_serial: "YOUR_DONGLE_SERIAL"
luxpower_inverter_serial: "YOUR_INVERTER_SERIAL"

# Stage 24 ESP-NOW placeholders. The receiver maps trusted Gateway MACs to
# stable device IDs. Real values belong only in ignored secrets.yaml.
gateway_peer_mac: "00:00:00:00:00:00"
display_peer_mac: "00:00:00:00:00:00"
espnow_encryption_key: "CHANGE_ME_FUTURE_KEY"
